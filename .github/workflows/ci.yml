name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: unit and contract tests
        run: npm test
      - name: eval replay (recorded model outputs, no API cost)
        run: npm run eval -- quote --replay
      - name: mutation check
        run: npm run test:mutate
