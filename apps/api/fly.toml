# fly launch 时会改 app 名；区域固定悉尼
app = "fluffdesk-api"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

# 每次部署前先把没跑过的迁移跑到 Neon；失败就不发布
[deploy]
  release_command = "node packages/db/dist/migrate.js"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
