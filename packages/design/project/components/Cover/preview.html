<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><style>
body { margin: 0; background: var(--color-ground); font-family: var(--font-sans); color: var(--color-ink); }
.cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
.cover svg { position: absolute; inset: 0; }
.name { position: absolute; left: 32px; bottom: 44px; font-family: var(--font-serif); font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 0; font-size: 112px; line-height: .92; letter-spacing: -0.015em; color: var(--color-ink); }
.tag { position: absolute; left: 34px; bottom: 22px; font-size: 13px; line-height: 16px; color: var(--color-muted); max-width: 440px; }
.g { fill: var(--color-ground); } .l { fill: var(--color-pearl-lilac); } .c { fill: var(--color-pearl-cyan); } .p { fill: var(--color-pearl-pink); }
.s { fill: var(--color-sheet); } .a { fill: var(--color-accent); } .i { fill: var(--color-ink); } .w { fill: var(--color-pending-bg); }
.tooth { fill: var(--color-accent); }
</style></head><body>
<div class="cover">
<!-- derivation:
     blocks: sheet 288x288 (radius-sheet 16) on ground; pearl-lilac 192x144, pearl-cyan 144x96, pearl-pink 144x96 as the three fields; accent 48x192 slab; ink square 48 (radius-card 8)
     arrangement: one sheet inset from the right like the app's framed-sheet shell, the three pearl fields staggered over its left edge, the accent slab as the one strong vertical
     pattern: the comb's three teeth (the product mark) as three pills, radius-pill, space-3 apart — "soft radii + a literal motif" row; the comb is fluffdesk's object, not the category's
     scales: 16 = radius-sheet, 8 = radius-card, 12/24/48 = space-3/5/7, pill = radius-pill -->
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
  <rect class="s" x="528" y="24" width="432" height="288" rx="16"/>
  <rect class="l" x="480" y="48" width="192" height="144" rx="16"/>
  <rect class="c" x="624" y="144" width="144" height="96" rx="16"/>
  <rect class="p" x="720" y="72" width="144" height="96" rx="16"/>
  <rect class="a" x="888" y="48" width="48" height="192" rx="8"/>
  <rect class="i" x="816" y="192" width="48" height="48" rx="8"/>
  <rect class="w" x="552" y="216" width="48" height="48" rx="8"/>
  <!-- the comb: three teeth as pills, 12 apart -->
  <rect class="tooth" x="696" y="36" width="12" height="60" rx="6"/>
  <rect class="tooth" x="720" y="36" width="12" height="60" rx="6"/>
  <rect class="tooth" x="744" y="36" width="12" height="60" rx="6"/>
</svg>
<div class="name">fluffdesk</div>
<div class="tag">Booking agent for solo pet groomers. The groomer decides; the agent only holds.</div>
</div>
</body></html>
